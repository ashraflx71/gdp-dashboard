# اسم سير العمل: النشر الملكي لموقع أشرف حسن
name: Deploy Static Content to Pages

on:
  # التشغيل عند الدفع (Push) لفرع الـ main
  push:
    branches: ["main"]

  # السماح بالتشغيل اليدوي من تبويب Actions
  workflow_dispatch:

# إعداد الصلاحيات المطلوبة للنشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# إدارة عمليات النشر المتزامنة
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # المسار للملفات التي تريد نشرها (تأكد أن ملفاتك في المجلد الرئيسي)
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
